name: Сборка
on:
  push:
    branches: ["**"]
    tags: ["*"]                  # тег (например 1.0.3) запускает сборку и прикрепляет файлы к релизу
  workflow_dispatch:
permissions:
  contents: write                # нужно, чтобы создавать релиз и загружать в него файлы
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --collect-data petrovich --windowed --onefile --icon assets/icon.ico --add-data "assets/icon.png;assets" --add-data "assets/gear.png;assets" --add-data "assets/gear_hover.png;assets" --name Debtors app.py
      - if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --collect-data petrovich --windowed --icon assets/icon.icns --add-data "assets/icon.png:assets" --add-data "assets/gear.png:assets" --add-data "assets/gear_hover.png:assets" --name Debtors app.py
          ./add_document_types.sh dist/Debtors.app
          cd dist && ditto -c -k --keepParent Debtors.app Debtors-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Debtors-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
      - name: Прикрепить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
