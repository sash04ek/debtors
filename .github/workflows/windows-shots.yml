name: Снимки на Windows
on:
  workflow_dispatch:
  push:
    branches: ["fix/windows-look"]
jobs:
  shots:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pillow
      - run: python tests/windows_shots.py light
      - run: python tests/windows_shots.py dark
      - run: python tests/windows_shots.py light 2.0
      - uses: actions/upload-artifact@v7
        with:
          name: windows-shots
          path: shots/*.png
